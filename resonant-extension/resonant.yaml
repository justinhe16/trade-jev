# trade-jev: Jev paper-trading NQ on the Mini. Reads the paper runner's SQLite DB (read-only)
# and can start or stop its launchd job. It never places orders: paper only. See README.md.
name: trade-jev
version: 1
description: Jev paper-trading NQ on the Mini; session status, live Jev calls, P&L vs baselines, trades, start/stop.
examples:
  - is trade-jev running?
  - how did jev do this week vs hold
  - start trade-jev
approvers: [owner]
repos: [justinhe16/trade-jev]
# Display only (the dashboard's diagram): the launchd agents scripts/install_launchd.sh installs from
# deploy/launchd. Resonant never installs, loads or reads them.
launch_agents:
  - label: com.tradejev.paper
    description: "Weekdays 06:15 PT: scripts/run_paper_day.sh runs one live paper session (Jev + baselines, no orders) to the close into data/paper.db; its live view is :8767."
  - label: com.tradejev.view
    description: "Always-on viewer at http://127.0.0.1:8765 (Replay, Live, Paper, Docs); /paper reads data/paper.db read-only. Not attached to the running live session."
  - label: com.tradejev.tvtoken
    description: "24/7 Tradovate token keep-alive: checks every minute, renews the web-session tokens before they lapse, writes data/tradovate_token_status.json."

tools:
  # Tool names match the evals (trade_jev_status is a plain read; start/stop ask first).
  trade_jev_status:
    description: >-
      Today's paper session (ET): running, done, crashed or stale; Jev's position, P&L, trades;
      `jev_live` (calls_mode: live model calls vs replay/no calls, call and error counts, latency,
      last decision, raw vs gated actions); launchd state; Tradovate token health (no secrets).
    run: ./cli.py status
    effect: read
  trade_jev_pnl:
    description: >-
      Paper P&L for Jev vs the baselines (hold, random, imbalance): pnl, trades, wins,
      drawdown, Jev calls (live from the decision log while running), cost. date "" = latest session, "today", "yesterday",
      YYYY-MM-DD, "week" (Mon to today), "month", or "A..B" (YYYY-MM-DD); ranges add a per-day list.
    run: ./cli.py pnl --date {date}
    effect: read
    args: {date: string}
  trade_jev_trades:
    description: >-
      Compact list of paper trades (ET times, side, prices, reason, pnl). date as in
      trade_jev_pnl ("" = latest session); policy "" means Jev, or a baseline name;
      limit 0 means 20 (max 50); the latest trades are shown.
    run: ./cli.py trades --date {date} --policy {policy} --limit {limit}
    effect: read
    args: {date: string, policy: string, limit: integer}
  trade_jev_decisions:
    description: >-
      The latest Jev decisions (ET): raw answer, gated action, position, probabilities, latency
      ms, error, plus `live` call stats (calls_mode). date as in trade_jev_pnl ("" = latest
      session); limit 0 means 20 (max 50). Answers "are model calls going out?".
    run: ./cli.py decisions --date {date} --limit {limit}
    effect: read
    args: {date: string, limit: integer}
  trade_jev_start:
    description: Start today's paper session (kickstarts the launchd job com.tradejev.paper).
    run: ./cli.py start
    effect: write
    level: L2          # asks when the model chose it; runs and reports when the owner typed it
    approval_summary: start trade-jev paper trading
    timeout_s: 30
  trade_jev_stop:
    description: Stop the paper session for today (SIGTERM to the launchd job com.tradejev.paper).
    run: ./cli.py stop
    effect: write
    level: L2          # not L3: a misread "stop" would end the day's session unasked
    approval_summary: stop trade-jev paper trading for today
    timeout_s: 30

jobs:
  - id: close-summary
    description: "Weekday 16:10 ET: reads paper.db and adds the day's paper P&L (Jev vs baselines, or why it crashed), named by its day, to the hourly pulse."
    schedule: "10 16 * * 1-5"
    tz: America/New_York
    run: ./cli.py close-summary
    effect: read
    level: L0
    timeout_s: 60
    catchup: 6h        # if the daemon was down at 16:10, report that day once it's back
  - id: watch
    description: "Every 15 min: texts at once if the Tradovate token is failing or expiring, or (trading days 09:35-15:50 ET) if the paper session crashed, stalled or is missing."
    # every 15 min, ALL day and every day: the Tradovate token check has no hours (tokens die over a
    # weekend). The paper-session check inside it stays script-guarded to 09:35..15:50 ET trading days.
    schedule: "5,20,35,50 * * * *"
    tz: America/New_York
    run: ./cli.py watch
    effect: read
    level: L0
    timeout_s: 60

# Dashboard panels (Resonant panels): read-only L0 runs that print data, never act. Every minute
# 09:00-16:59 ET on weekdays (cron has no 09:15-16:15; that covers the session), every 15 min otherwise.
panels:
  - id: paper
    title: Paper trading
    description: "Jev vs baselines today: P&L, model calls, session, token, agents; daily P&L and sessions for 30 trading days."
    command: [./cli.py, panel, paper]
    refresh:
      idle: "*/15 * * * *"
      active: "*/1 9-16 * * 1-5"
    tz: America/New_York
    timeout_s: 30
    max_bytes: 24576
  - id: chart
    title: Jev trades
    description: "Today's NQ 1-minute mid candles with Jev's paper trades (entry to exit, $ P&L, why); the last session's when there's none today."
    command: [./cli.py, panel, chart]
    refresh:
      idle: "*/15 * * * *"
      active: "*/1 9-16 * * 1-5"
    tz: America/New_York
    timeout_s: 30
    max_bytes: 32768

# watch's "trade-jev/down" and "trade-jev/token" text at once; close-summary's daily P&L rides the hourly pulse.
report: {max_urgency: urgent}
health: {check: ./cli.py health, every: 5m}
